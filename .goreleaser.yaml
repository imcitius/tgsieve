version: 2

project_name: tgsieve

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tgsieve
    main: .
    binary: tgsieve
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tgsieve
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - TODO.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: tgsieve
    binaries: [tgsieve]
    repository:
      owner: imcitius
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    directory: Casks
    # Publishing the cask needs a token for the tap repo. Without one the
    # release still ships binaries; only the formula update is skipped.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/imcitius/tgsieve
    description: Terragrunt plans without the wall of text
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    hooks:
      post:
        # The binary is not notarized, so macOS would otherwise refuse to run it.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tgsieve"]
          end
